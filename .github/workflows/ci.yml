name: CI

# Every push and every pull request. Nothing here reads a secret, so a fork's
# runs are as green as this repository's, with no setup.
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes the one still running.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  contract:
    name: contract (schema + validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      # scripts/validate.bundle.mjs is a generated file that lives in git, because
      # the skill runs it where node_modules does not exist. Regenerate it and
      # insist the tree stays clean: a validator source edited without re-running
      # the bundler would otherwise ship a stale artifact to every plugin install.
      - run: npm run bundle:validator
      - run: git diff --exit-code scripts/validate.bundle.mjs

  viewer:
    name: viewer (suite, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            viewer/package-lock.json
      # Both installs, in both packages. The viewer imports the shared
      # validator at scripts/validate-pure.mjs, and that file's own `ajv`
      # import resolves from the root node_modules — a viewer-only install
      # leaves it unresolvable for the suite and for the build alike.
      - run: npm ci
        working-directory: .
      - run: npm ci
      # The suite runs in one worker: ELK's layout engine is module-level state
      # that parallel files trample.
      - run: npm test -- --fileParallelism=false
      - run: npx tsc -b
      # Same command and same output directory the Pages workflow publishes
      # (viewer/dist), so a green build here is a publishable artifact there.
      - run: npm run build
      # viewer/dist lives in git, because scripts/serve.mjs serves it on a
      # machine with no node_modules to build it from. Same gate as the
      # validator bundle in the contract job: rebuild it and insist the tree
      # stays clean, so a viewer edited without a rebuild cannot ship a stale
      # dist to every plugin install.
      - run: git diff --exit-code viewer/dist
        working-directory: .
